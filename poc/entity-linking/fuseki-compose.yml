services:
  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      FUSEKI_DATASET_1: entity_linking
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-entity-linking-local}
    ports:
      - "127.0.0.1:13037:3030"
    mem_limit: 3g
    cpus: 2.0
    tmpfs:
      - /fuseki:rw,noexec,nosuid,size=1g,uid=100,gid=101,mode=0770

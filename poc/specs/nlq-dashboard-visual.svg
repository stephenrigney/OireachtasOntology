<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-labelledby="title desc">
<title id="title">NLQ dashboard design reference</title>
<desc id="desc">Text-only OireachtasOntology masthead; warm off-white page with nearly white bordered question, result, query explanation and feedback cards; dark text and gold accents. Content illustrative.</desc>
<defs><style><![CDATA[
text{font-family:"IBM Plex Sans","Segoe UI",Arial,sans-serif;fill:#202124}
.head{font-size:37px;font-weight:700}.eyebrow{font-size:20px;font-weight:700;fill:#6B5922}
.sub{font-size:20px;fill:#4A463D}.sect{font-size:25px;font-weight:700}
.body{font-size:19px}.small{font-size:16px}.bold{font-weight:700}
.muted{fill:#4A463D}.gold{fill:#6B5922}.white{fill:white}.good{fill:#146B37}
.card{fill:#fff;stroke:#ABB0B6;stroke-width:1.5}
.sep{stroke:#D4D7DB;stroke-width:1.5}
]]></style></defs>
<rect width="1280" height="1010" fill="#F6F3EA"/>
<text class="eyebrow" x="42" y="47">OIREACHTAS ONTOLOGY</text>
<text class="head" x="42" y="88">Natural language queries</text>
<text class="sub" x="42" y="120">Explore Oireachtas data through ordinary language</text>
<rect x="28" y="140" width="1224" height="3" fill="#6B5922"/>
<rect class="card" x="30" y="164" rx="8" width="1220" height="138"/>
<text class="sect" x="57" y="203">Ask a question</text>
<rect x="57" y="222" rx="6" width="900" height="55" fill="#FDFDFC" stroke="#ABB0B6" stroke-width="1.5"/>
<text class="body" x="77" y="256">Who represented Waterford in the last Dáil?</text>
<rect x="975" y="222" rx="6" width="248" height="55" fill="#6B5922"/>
<text class="body bold white" x="1035" y="257">Ask question</text>
<rect class="card" x="30" y="322" rx="8" width="1220" height="270"/>
<text class="sect" x="57" y="362">Results</text>
<circle cx="1027" cy="351" r="12" stroke="#146B37" stroke-width="2.4" fill="none"/>
<path d="M1021 351l4 4 8-9" stroke="#146B37" stroke-width="2.4" fill="none"/>
<text class="small good bold" x="1048" y="357">Query completed</text>
<text class="body muted" x="57" y="396">Example matching records (illustrative data only).</text>
<path class="sep" d="M57 416h1165 M57 460h1165 M57 503h1165 M57 547h1165"/>
<text class="body bold" x="72" y="447">Member record 1</text><text class="body" x="680" y="447">Affiliation if available</text>
<text class="body bold" x="72" y="490">Member record 2</text><text class="body" x="680" y="490">Affiliation if available</text>
<text class="body bold" x="72" y="533">Member record 3</text><text class="body" x="680" y="533">Affiliation if available</text>
<text class="small muted" x="72" y="575">Actual result columns, caveats and links depend on the query.</text>
<rect class="card" x="30" y="613" rx="8" width="1220" height="279"/>
<text class="sect" x="57" y="653">How this query was processed</text>
<rect x="57" y="677" rx="6" width="364" height="72" fill="#6B5922"/>
<rect x="427" y="677" rx="6" width="380" height="72" fill="#F0F0EF" stroke="#D4D7DB"/>
<rect x="813" y="677" rx="6" width="410" height="72" fill="#F0F0EF" stroke="#D4D7DB"/>
<circle cx="96" cy="713" r="24" fill="white"/>
<text x="81" y="721" font-size="22" font-weight="700" fill="#6B5922">01</text>
<text class="body bold white" x="142" y="707">Interpreted</text>
<text x="142" y="733" font-size="16" fill="white">Understand the question</text>
<circle cx="467" cy="713" r="24" fill="#D8D8D5"/>
<text x="452" y="721" font-size="22" font-weight="700">02</text>
<text class="body bold" x="511" y="707">Compiled</text>
<text class="small" x="511" y="733">Create a database query</text>
<circle cx="853" cy="713" r="24" fill="#D8D8D5"/>
<text x="838" y="721" font-size="22" font-weight="700">03</text>
<text class="body bold" x="897" y="707">Executed</text>
<text class="small" x="897" y="733">Run query and return results</text>
<text class="sect" x="57" y="791">Interpretation</text>
<text class="small" x="57" y="820">The question requests a representation relationship,</text>
<text class="small" x="57" y="843">a constituency and a relative parliamentary term.</text>
<path class="sep" d="M734 768v105"/>
<text class="sect" x="770" y="790">Details</text>
<rect x="770" y="807" width="448" height="28" fill="#F7F6F2" stroke="#D4D7DB"/>
<rect x="770" y="835" width="448" height="28" fill="#F7F6F2" stroke="#D4D7DB"/>
<rect x="770" y="863" width="448" height="28" fill="#F7F6F2" stroke="#D4D7DB"/>
<text class="small" x="786" y="827">Plan explanation</text>
<text class="small" x="786" y="855">Structured plan (JSON)</text>
<text class="small" x="786" y="883">Generated SPARQL</text>
<rect class="card" x="30" y="913" rx="8" width="1220" height="75"/>
<text class="sect" x="57" y="960">Was this response adequate?</text>
<rect x="930" y="930" rx="5" width="132" height="43" fill="white" stroke="#6B5922" stroke-width="1.7"/>
<text class="body bold gold" x="976" y="957">Yes</text>
<rect x="1079" y="930" rx="5" width="143" height="43" fill="white" stroke="#6B5922" stroke-width="1.7"/>
<text class="body bold gold" x="1133" y="957">No</text>
</svg>
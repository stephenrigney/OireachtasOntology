name: Routine validation

on:
  push:
  pull_request:

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra test
      - name: Ontology, HermiT, mapping integrity
        run: mise exec -- .venv/bin/python tests/validate.py
      - name: Regression suite
        run: mise exec -- .venv/bin/python -m pytest -q tests

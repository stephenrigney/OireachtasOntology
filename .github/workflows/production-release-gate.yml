name: Production release gate

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Release/review reference for this disposable acceptance run
        required: true
        type: string

permissions:
  contents: read

jobs:
  disposable-full-stack-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: astral-sh/setup-uv@v6
      - name: Install Restic
        run: sudo apt-get update && sudo apt-get install --yes restic
      - run: uv sync --locked --extra test
      - name: Run complete disposable production acceptance
        run: scripts/production-release-gate.sh release-evidence.json
      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-tranche-c-release-gate-${{ github.sha }}
          path: release-evidence.json
          if-no-files-found: warn

[project]
name = "oireachtas-ontology"
version = "0.1.0"
description = "Houses of the Oireachtas ontology and ETL validation baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "owlready2>=0.50,<0.51",
  "rdflib>=7.6,<8",
  "pyshacl>=0.30,<0.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The import package lives under src/; make the src layout explicit so a normal
# `uv sync` installs `oireachtas_etl` rather than relying on setuptools
# auto-discovery.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
  "pytest>=9.1,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
]
nlq = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
oir-etl = "oireachtas_etl.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
oireachtas_etl = ["validation/resources/*.ttl", "validation/resources/*.rq"]

[project]
name = "oireachtas-ontology"
version = "0.1.0"
description = "Houses of the Oireachtas ontology and ETL validation baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "owlready2>=0.50,<0.51",
  "rdflib>=7.6,<8",
  "pyshacl>=0.30,<0.31",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1,<10",
]

[project.scripts]
oir-etl = "oireachtas_etl.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
oireachtas_etl = ["validation/resources/*.ttl", "validation/resources/*.rq"]
